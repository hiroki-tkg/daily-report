name: OLIVE+ 上場一覧

on:
  schedule:
    # 日・火・木 20:45 JST（翌日の表日＝月・水・金の上場一覧を取得）
    - cron: "45 11 * * 0,2,4"
  workflow_dispatch:
    inputs:
      date:
        description: "売立日 YYYYMMDD（空なら次の表日）"
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 openpyxl
      - name: 取得
        working-directory: olive
        env:
          OLIVE_ID: ${{ secrets.OLIVE_ID }}
          OLIVE_PASSWORD: ${{ secrets.OLIVE_PASSWORD }}
          OLIVE_BISC: ${{ secrets.OLIVE_BISC }}
          OLIVE_BISE: ${{ secrets.OLIVE_BISE }}
        run: python fetch_offer.py --out html ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: 集計
        working-directory: olive
        run: |
          d=$(ls html | head -1 | cut -d_ -f1)
          python parse_offer.py html/*.html -o "olive_${d}.xlsx"
      - name: スプレッドシートに書き込み
        working-directory: olive
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python export_sheet.py html/*.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olive-offer
          path: olive/olive_*.xlsx
          retention-days: 90
